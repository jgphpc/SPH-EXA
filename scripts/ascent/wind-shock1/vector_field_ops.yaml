-
  action: "add_pipelines"
  pipelines:
    pl_geometric_clip: 
      f1: 
        type: "clip"
        params: 
          invert: "true" # "false" removes all particles in the negative zone of "normal"
          plane: 
            point: 
              x: 0.5
              y: 0.125
              z: 0.125
            normal: 
              x: 0.0
              y: 1.0
              z: 0.0
      f2:
        type: "log10"
        params: 
          field: "Temperature"
          output_name: "log10_Temperature"
    pl1:
      f1:
        type: "composite_vector"
        params:
          field1: "vx"
          field2: "vy"
          field3: "vz"
          output_name: "velocity"
      f2:
        type: "vector_magnitude"
        params:
          field: "velocity"
          output_name: "velocity_magnitude"
    pl_threshold_thin_clip_z:
      f1:
        type: "threshold"
        params:
          field: "z"
          min_value: 0.12425
          max_value: 0.12575
    pl_threshold_thin_clip_y:
      f1:
        type: "threshold"
        params:
          field: "y"
          min_value: 0.12425
          max_value: 0.12575
